name: CI

on:
  pull_request:
  # Pushes to main/tags run CI via docker-publish.yml (workflow_call), gating the image build.
  workflow_call:

# Least privilege: CI only reads the repo. When called from docker-publish.yml, the
# caller's `ci` job grants the same `contents: read`, so this can't be elevated there.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Check, lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo check test --continue

      # Runs after check so .svelte-kit/tsconfig.json exists for type-aware linting.
      - run: pnpm lint

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm turbo build --filter=@parlor/app^...

      - name: Install Playwright browsers
        run: pnpm --filter @parlor/app exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm --filter @parlor/app test:e2e
        env:
          CI: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: apps/parlor/test-results/
          retention-days: 7
